# Spectral ruleset for MCP (Model Context Protocol) tool definitions.
# Validates documents shaped like a `tools/list` result: { "tools": [ ... ] }
#
# Usage:
#   spectral lint -r mcp-ruleset.yaml path/to/mcp-tools.json

functionsDir: ./functions
functions:
  - mcp-tool-naming-convention
  - mcp-no-duplicate-keys
  - mcp-required-matches-properties

rules:
  mcp:MCR001:
    description: "Every tool must have a name that follows the configured naming convention (default: snake_case)."
    message: "MCR001: {{error}}"
    severity: error
    resolved: false
    given: "$"
    then:
      function: mcp-tool-naming-convention
      functionOptions:
        naming-convention: snake_case

  mcp:MCR002:
    description: Tool title should be a valid non-null string.
    message: "MCR002: {{description}} {{error}}"
    severity: warn
    given: $.tools[*]
    then:
      # `schema` reports both a missing title and a null / non-string / empty one.
      field: title
      function: schema
      functionOptions:
        schema:
          type: string
          minLength: 1

  mcp:MCR003:
    description: Tools must have a clear description.
    message: "MCR003: {{description}} {{error}}"
    severity: error
    given: $.tools[*]
    then:
      field: description
      function: truthy

  mcp:MCR004:
    description: Tool objects should not contain duplicate keys (e.g. duplicate _meta).
    message: "MCR004: {{error}}"
    severity: error
    given: $.tools[*]
    then:
      function: mcp-no-duplicate-keys

  mcp:MCR005:
    description: Input schemas must be defined as an object type.
    message: "MCR005: {{description}} {{error}}"
    severity: error
    given: $.tools[*]
    then:
      - field: inputSchema
        function: truthy
      - field: inputSchema.type
        function: truthy
      - field: inputSchema.type
        function: pattern
        functionOptions:
          match: "^object$"

  mcp:MCR006:
    description: Every input property should have a description detailing its usage.
    message: "MCR006: {{description}} {{error}}"
    severity: info
    given: $.tools[*].inputSchema.properties[*]
    then:
      field: description
      function: defined

  mcp:MCR007:
    description: Embedded OpenAPI definitions must specify a valid OpenAPI 3.x version.
    message: "MCR007: {{description}} {{error}}"
    severity: error
    given: $.tools[*].inputSchema.properties..openapi
    then:
      function: pattern
      functionOptions:
        match: "^3\\."

  mcp:MCR008:
    description: Listed required fields in nested OpenAPI schemas must exist in properties.
    message: "MCR008: {{error}}"
    severity: error
    given: $.tools[*].inputSchema.properties..schemas[*]
    then:
      function: mcp-required-matches-properties

  mcp:MCR009:
    description: outputSchema should be provided or mapped rather than left null.
    message: "MCR009: {{description}} {{error}}"
    severity: warn
    given: $.tools[*]
    then:
      field: outputSchema
      function: truthy
